<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dotel Jaya Laxmi | Presentation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #1e293b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
    }

    h1 {
      font-size: 1.8rem;
      color: #38bdf8;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 1rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      background-color: #3b82f6;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 25px;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: #2563eb;
    }

    h2 {
      font-size: 1.3rem;
      color: #f1f5f9;
      border-bottom: 2px solid #334155;
      padding-bottom: 6px;
      margin-top: 20px;
      margin-bottom: 15px;
    }

    .skill-group {
      margin-bottom: 15px;
    }

    .skill-title {
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 4px;
    }

    .skill-desc {
      color: #cbd5e1;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Hi, I'm Dotel Jaya Laxmi 👋</h1>
    <p class="subtitle">Computer Engineering Student at Seoul Theological University</p>
    
    <a href="#" class="btn">Click For Welcome Message</a>

    <h2>Technical Skills</h2>

    <div class="skill-group">
      <div class="skill-title">🌐 Web Dev</div>
      <div class="skill-desc">HTML5, CSS3, JavaScript</div>
    </div>

    <div class="skill-group">
      <div class="skill-title">🐍 Python</div>
      <div class="skill-desc">Logic Building, Spyder IDE</div>
    </div>

    <div class="skill-group">
      <div class="skill-title">🛠️ Tools</div>
      <div class="skill-desc">VS Code, Git, GitHub</div>
    </div>
  </div>

</body>
</html>
