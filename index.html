<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dotel Jaya Laxmi | Portfolio</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: radial-gradient(circle at top left, #0f172a, #020617);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-width: 550px;
            width: 100%;
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .skills-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .badge {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #ffffff;
            padding: 10px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body>

    <div class="card">
        
        <img src="profile.jpg" alt="Dotel Jaya Laxmi" class="profile-img">
        
        <h1>Hi, I'm Dotel Jaya Laxmi 👋</h1>
        <p>Computer Technology Student in South Korea, learning web development and building creative projects step-by-step.</p>
        
        <div class="skills-container">
            <span class="badge"><i class="fa-solid fa-code"></i> HTML</span>
            <span class="badge"><i class="fa-solid fa-laptop-code"></i> Python</span>
            <span class="badge"><i class="fa-solid fa-toolbox"></i> Git & VS Code</span>
        </div>

        <a href="#contact" class="btn">Contact Me</a>
    </div>

</body>
</html>
