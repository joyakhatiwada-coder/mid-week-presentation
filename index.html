<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Midterm Presentation - Dotel Jaya Laxmi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="main-container">
        <!-- 3D Flip Card -->
        <div class="card">
            
            <!-- FRONT SIDE OF CARD -->
            <div class="card-side front">
                <div class="tag">MIDTERM PRESENTATION</div>
                <div class="profile-icon">
                    <i class="fa-solid fa-user-astronaut"></i>
                </div>
                <h1>Dotel Jaya Laxmi</h1>
                <p class="role">Computer & Language Student</p>
                <p class="location"><i class="fa-solid fa-location-dot"></i> Korea</p>
                <div class="hint">
                    <i class="fa-solid fa-rotate"></i> Hover / Tap to Flip Card
                </div>
            </div>

            <!-- BACK SIDE OF CARD -->
            <div class="card-side back">
                <h2>My Goal</h2>
                <div class="skills">
                    <div class="skill-item"><i class="fa-solid fa-laptop-code"></i> Learn computer skills</div>
                    <div class="skill-item"><i class="fa-solid fa-chart-line"></i> Improve step by step</div>
                </div>
                <p class="desc">Interactive web card built with clean semantic code & smooth 3D animations.</p>
                <button class="status-btn">Completed <i class="fa-solid fa-circle-check"></i></button>
            </div>

        </div>
    </div>
</body>
</html>
