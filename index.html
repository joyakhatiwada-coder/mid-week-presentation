<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dotel Jaya Laxmi | Portfolio</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background: radial-gradient(circle at top left, #0f172a, #020617);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      max-width: 550px;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
    }

    .header {
      margin-bottom: 28px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .subtitle {
      font-size: 1rem;
      color: #94a3b8;
      margin-top: 6px;
      line-height: 1.5;
    }

    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #38bdf8;
      font-weight: 700;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
    }

    .skills-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .skill-item {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 16px;
      border-radius: 12px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .skill-item:hover {
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.3);
    }

    .skill-header {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 8px;
    }

    .skill-header i {
      color: #38bdf8;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>Hi, I'm Dotel Jaya Laxmi 👋</h1>
      <p class="subtitle">Computer Engineering Student at Seoul Theological University</p>
    </div>

    <div class="section-title">Technical Skills</div>

    <div class="skills-grid">
      <div class="skill-item">
        <div class="skill-header">
          <i class="fa-solid fa-code"></i>
          <span>Web Development</span>
        </div>
        <div class="tags">
          <span class="tag">HTML5</span>
          <span class="tag">CSS3</span>
          <span class="tag">JavaScript</span>
        </div>
      </div>

      <div class="skill-item">
        <div class="skill-header">
          <i class="fa-brands fa-python"></i>
          <span>Python Programming</span>
        </div>
        <div class="tags">
          <span class="tag">Logic Building</span>
          <span class="tag">Spyder IDE</span>
        </div>
      </div>

      <div class="skill-item">
        <div class="skill-header">
          <i class="fa-solid fa-screwdriver-wrench"></i>
          <span>Tools & Environment</span>
        </div>
        <div class="tags">
          <span class="tag">VS Code</span>
          <span class="tag">Git</span>
          <span class="tag">GitHub</span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
