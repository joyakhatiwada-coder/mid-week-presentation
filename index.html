<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midterm Presentation - Dotel Jaya Laxmi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="main-container">
        <!-- Single Front Profile Card -->
        <div class="card single-card">
            <div class="tag">MIDTERM PRESENTATION</div>
            
            <div class="profile-icon">
                <i class="fa-solid fa-user-astronaut"></i>
            </div>
            
            <h1>Dotel Jaya Laxmi</h1>
            <p class="role">Computer & Language Student</p>
            <p class="location"><i class="fa-solid fa-location-dot"></i> Korea</p>
            
            <hr class="divider">

            <div class="goal-section">
                <h3><i class="fa-solid fa-bullseye"></i> My Goal</h3>
                <div class="skills">
                    <div class="skill-item"><i class="fa-solid fa-laptop-code"></i> Learn computer skills</div>
                    <div class="skill-item"><i class="fa-solid fa-chart-line"></i> Improve step by step</div>
                </div>
            </div>

            <button class="status-btn">Completed <i class="fa-solid fa-circle-check"></i></button>
        </div>
    </div>
</body>
</html>
